name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blackwater
          POSTGRES_PASSWORD: blackwater
          POSTGRES_DB: blackwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Write .env.test
        run: |
          cat <<EOF > .env.test
          DATABASE_URL=postgresql://blackwater:blackwater@localhost:5432/blackwater_test?schema=public
          JWT_SECRET=ci_only_secret_at_least_32_characters_long
          JWT_EXPIRES_IN=1d
          PORT=8001
          NODE_ENV=test
          EOF

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
