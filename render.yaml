# Render Blueprint: one always-on web service plus its PostgreSQL database.
# In the Render dashboard choose New > Blueprint and select this repository.
# No secret is typed anywhere: the database URL is wired from the database, and
# the JWT secret is generated by Render.
#
# Paid plans are deliberate. A Free web service spins down after 15 minutes
# without traffic (which drops every Socket.IO connection) and a Free database
# expires after 30 days and is then deleted.

databases:
  - name: blackwater-db
    databaseName: blackwater
    user: blackwater
    plan: basic-256mb
    postgresMajorVersion: "16" # the version CI tests against
    region: singapore
    # An empty allow-list means only Render services in the same region can
    # connect. Add your own IP here if you need psql or pg_dump from outside.
    ipAllowList: []

services:
  - type: web
    name: blackwater
    runtime: docker
    plan: starter
    region: singapore # keep in the same region as the database
    # BlackWater keeps Socket.IO rooms and rate-limit counters in memory, so it
    # must run as exactly one instance.
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blackwater-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render's load balancer is one proxy in front of the app. Without this
      # every visitor shares the proxy's IP and one rate-limit bucket.
      - key: TRUST_PROXY
        value: "1"
